services:
  audio-worker-1:
    image: rg.fr-par.scw.cloud/crm-courtier/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    stop_grace_period: 650s
    deploy:
      resources:
        limits:
          memory: 512M
    command: >
      php artisan queue:work redis --queue=audio,default
        --verbose --tries=3 --timeout=600 --sleep=3
        --max-jobs=500 --max-time=3600
    volumes:
      - worker_temp:/var/www/html/storage/app/temp
      - worker_logs:/var/www/html/storage/logs

  audio-worker-2:
    image: rg.fr-par.scw.cloud/crm-courtier/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    stop_grace_period: 650s
    deploy:
      resources:
        limits:
          memory: 512M
    command: >
      php artisan queue:work redis --queue=audio,default
        --verbose --tries=3 --timeout=600 --sleep=3
        --max-jobs=500 --max-time=3600
    volumes:
      - worker_temp:/var/www/html/storage/app/temp
      - worker_logs:/var/www/html/storage/logs

  audio-worker-3:
    image: rg.fr-par.scw.cloud/crm-courtier/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    stop_grace_period: 650s
    deploy:
      resources:
        limits:
          memory: 512M
    command: >
      php artisan queue:work redis --queue=audio,default
        --verbose --tries=3 --timeout=600 --sleep=3
        --max-jobs=500 --max-time=3600
    volumes:
      - worker_temp:/var/www/html/storage/app/temp
      - worker_logs:/var/www/html/storage/logs

  import-worker:
    image: rg.fr-par.scw.cloud/crm-courtier/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    stop_grace_period: 650s
    deploy:
      resources:
        limits:
          memory: 512M
    command: >
      php artisan queue:work redis --queue=import,default
        --verbose --tries=3 --timeout=600 --sleep=3
        --max-jobs=500 --max-time=3600
    volumes:
      - worker_temp:/var/www/html/storage/app/temp
      - worker_logs:/var/www/html/storage/logs

  scheduler:
    image: rg.fr-par.scw.cloud/crm-courtier/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        while true; do
          php artisan schedule:run --verbose --no-interaction
          sleep 60
        done
    volumes:
      - scheduler_logs:/var/www/html/storage/logs

volumes:
  worker_temp:
  worker_logs:
  scheduler_logs:
