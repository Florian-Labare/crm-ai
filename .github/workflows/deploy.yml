name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: rg.fr-par.scw.cloud/crm-courtier
  IMAGE_NAME: backend

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=$(echo $GITHUB_SHA | head -c 7)" >> $GITHUB_OUTPUT

      - name: Login to Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login ${{ env.REGISTRY }} -u nologin --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -f backend/Dockerfile.prod \
            ./backend

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/ --project-name=crm-courtier
          workingDirectory: frontend

  deploy-app-server:
    name: Deploy App Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to app-server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_SERVER_IP }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/crm
            echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud/crm-courtier -u nologin --password-stdin
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            docker compose pull
            docker compose up -d --remove-orphans
            # Wait for health check
            sleep 10
            docker compose ps
            curl -sf http://localhost:8000/api/health/audio || echo "WARNING: Health check failed"

  deploy-worker-server:
    name: Deploy Worker Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to worker-server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WORKER_SERVER_IP }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/crm
            echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud/crm-courtier -u nologin --password-stdin
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

  notify-sentry:
    name: Notify Sentry
    runs-on: ubuntu-latest
    needs: [deploy-app-server, deploy-worker-server]
    if: always() && needs.deploy-app-server.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}
